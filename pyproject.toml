[build-system]
requires = ["setuptools>=62"]
build-backend = "setuptools.build_meta"

[project]
name = "genshin_calculator"
version = "0.1.0"
dependencies = [
  "pandas",
]
requires-python = ">=3.8"
authors = [
  {name = "Axel ROCHEL"},
]
description = "A calculator to find best builds."
readme = "README.md"

[tool.setuptools.packages.find]
include = ["genshin_calculator*"]